<svg xmlns="http://www.w3.org/2000/svg" width="680" height="582" viewBox="0 0 680 582" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
    </marker>
    <marker id="ahr" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#A32D2D" stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .th{font-size:14px;font-weight:500;fill:#2C2C2A}
    .ts{font-size:12px;fill:#5F5E5A}
    .side{font-size:12px;fill:#888780}
    .arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#ah)}
    .arrr{fill:none;stroke:#A32D2D;stroke-width:1.5;marker-end:url(#ahr)}
  </style>

  <rect x="120" y="14" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5"/>
  <text class="ts" x="138" y="24">数据</text>
  <rect x="188" y="14" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="ts" x="206" y="24">规则引擎（确定性）</text>
  <rect x="338" y="14" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B"/>
  <text class="ts" x="356" y="24">LLM（语义 / 生成）</text>

  <rect x="170" y="48" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="th" x="320" y="70" text-anchor="middle">① 触发预测</text>
  <text class="ts" x="320" y="86" text-anchor="middle">点击单条 / 批量 · 或 NLP 指令</text>
  <text class="side" x="160" y="75" text-anchor="end">入口</text>

  <rect x="170" y="112" width="300" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text class="th" x="320" y="134" text-anchor="middle">② 读取画像 + 投保申请</text>
  <text class="ts" x="320" y="150" text-anchor="middle">数据服务 → PostgreSQL</text>
  <text class="side" x="160" y="139" text-anchor="end">数据</text>

  <rect x="170" y="176" width="300" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="th" x="320" y="198" text-anchor="middle">③ 规则引擎算分</text>
  <text class="ts" x="320" y="214" text-anchor="middle">BMI / 血压 / 烟酒 / 年龄 / 职业 累加</text>
  <text class="side" x="160" y="203" text-anchor="end">规则引擎</text>

  <rect x="500" y="176" width="140" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
  <text class="th" x="570" y="198" text-anchor="middle" fill="#791F1F">直接拒保</text>
  <text class="ts" x="570" y="214" text-anchor="middle" fill="#A32D2D">命中拒保项 · 不计分</text>
  <line class="arrr" x1="470" y1="199" x2="498" y2="199"/>

  <rect x="170" y="240" width="300" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text class="th" x="320" y="262" text-anchor="middle">④ LLM 语义归类</text>
  <text class="ts" x="320" y="278" text-anchor="middle">病史 / 家族史 → 评分档（爱码 LLM）</text>
  <text class="side" x="160" y="267" text-anchor="end">LLM</text>

  <rect x="170" y="304" width="300" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="th" x="320" y="326" text-anchor="middle">⑤ 定级与结论</text>
  <text class="ts" x="320" y="342" text-anchor="middle">总分 → 等级区间 → 结论 + 加费比例</text>
  <text class="side" x="160" y="331" text-anchor="end">规则引擎</text>

  <rect x="170" y="368" width="300" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text class="th" x="320" y="390" text-anchor="middle">⑥ LLM 生成关键因子</text>
  <text class="ts" x="320" y="406" text-anchor="middle">key_factors 文本（爱码 LLM）</text>
  <text class="side" x="160" y="395" text-anchor="end">LLM</text>

  <rect x="170" y="432" width="300" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text class="th" x="320" y="454" text-anchor="middle">⑦ 写回结果</text>
  <text class="ts" x="320" y="470" text-anchor="middle">underwriting_decisions（AI 生成字段）</text>
  <text class="side" x="160" y="459" text-anchor="end">数据</text>

  <rect x="170" y="496" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="th" x="320" y="518" text-anchor="middle">⑧ 返回前端展示</text>
  <text class="ts" x="320" y="534" text-anchor="middle">评分 / 等级 / 结论 / 加费 / 因子</text>
  <text class="side" x="160" y="523" text-anchor="end">前端</text>

  <line class="arr" x1="320" y1="94" x2="320" y2="110"/>
  <line class="arr" x1="320" y1="158" x2="320" y2="174"/>
  <line class="arr" x1="320" y1="222" x2="320" y2="238"/>
  <line class="arr" x1="320" y1="286" x2="320" y2="302"/>
  <line class="arr" x1="320" y1="350" x2="320" y2="366"/>
  <line class="arr" x1="320" y1="414" x2="320" y2="430"/>
  <line class="arr" x1="320" y1="478" x2="320" y2="494"/>
</svg>
