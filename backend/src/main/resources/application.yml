server:
  port: 8080

spring:
  # 本地覆盖（DeepSeek 测试等），文件已 gitignore；不存在则忽略
  config:
    import: "optional:classpath:application-local.yml"
  datasource:
    url: jdbc:postgresql://localhost:5432/aicompetition
    username: housenchuan
    password:
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aicompetition.entity
  type-handlers-package: com.aicompetition.typehandler
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true

# 爱码 Chat API
ai:
  aicoder:
    api-key: 0cbfa790ff4d0a12a32c55d1f4976a7a11892821c5a5a2acfeb66695bfd8b90cd5edbd3c719381bb330d1df349fcacc
    base-url: http://wizard-ai.paic.com.cn/code_pilot/api/v1
    model: aicoder-plus
    default-temperature: 0.7
    default-max-tokens: 4096
  # 预测时是否用 LLM 增强关键因子文本（内网爱码可达默认开；调用失败自动降级纯规则引擎）
  predict:
    use-llm: true
  # 自然语言解析是否用 LLM（内网爱码可达默认开；调用失败自动降级本地规则解析）
  nl:
    use-llm: true

logging:
  level:
    com.aicompetition: debug
